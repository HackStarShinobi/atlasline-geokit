[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasline-geokit"
version = "0.3.2"
description = "Python toolkit for the Atlasline Geo API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["requests>=2.28", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
